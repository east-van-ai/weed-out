[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weed-out"
version = "0.3.1"
description = "Delete everything in a directory tree except what you explicitly say to keep."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Go Nakamaru" }]
keywords = ["cli", "cleanup", "filesystem", "orphan release branch"]
dependencies = ["Send2Trash>=1.8"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# Local tooling, never shipped. A dependency group stays out of the wheel and
# off PyPI, which an optional-dependencies extra would not. Install with
# `pip install -e . --group dev` (needs pip 25.1+). The ruff and black pins are
# exact on purpose: the pin is what freezes ruff's default rule set.
[dependency-groups]
dev = [
    "black==25.11.0",
    "pytest",
    "pytest-cov",
    "ruff==0.16.0",
]

[project.urls]
Homepage = "https://github.com/east-van-ai/weed-out"

[project.scripts]
weed-out = "weed_out.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
# sys capture required by the subprocess-based integration tests
addopts = "--capture=sys"
testpaths = ["tests"]
